<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#16202E; --muted:#64708A; --line:#E1E6EF;
  --accent:#2457D6; --accent-soft:#E6EDFC; --accent-ink:#FFFFFF;
  --high:#D23B4B; --med:#C98A0B; --low:#2E8B6A; --danger:#D23B4B;
  --shadow:0 1px 2px rgba(22,32,46,.05),0 12px 32px -12px rgba(22,32,46,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131C; --surface:#161D29; --ink:#E8ECF4; --muted:#8B97AE; --line:#263044;
    --accent:#6C93FF; --accent-soft:#1D2A4A; --accent-ink:#0E131C;
    --high:#FF7A87; --med:#E8B24A; --low:#5CC9A0; --danger:#FF7A87;
    --shadow:0 12px 32px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#161D29; --ink:#E8ECF4; --muted:#8B97AE; --line:#263044;
  --accent:#6C93FF; --accent-soft:#1D2A4A; --accent-ink:#0E131C;
  --high:#FF7A87; --med:#E8B24A; --low:#5CC9A0; --danger:#FF7A87;
  --shadow:0 12px 32px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:clamp(16px,5vw,56px) 16px; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{max-width:680px;margin:0 auto}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
.top h1{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.top p{color:var(--muted);margin-top:6px;font-size:.95rem}
.top-right{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:214;stroke-dashoffset:214;transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.theme{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.theme:hover{color:var(--ink)}
.theme svg{width:18px;height:18px}

/* Card */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}

/* Add form */
.add{padding:16px;margin-bottom:16px}
.add-row{display:flex;gap:10px}
.add input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.add input[type=text]::placeholder{color:var(--muted)}
.add input:focus,.add select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 20px;font-weight:600;white-space:nowrap}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:translateY(1px)}
.opts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.opts select,.opts input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:.88rem;color:var(--ink)}

/* Filters */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:none;padding:6px 14px;border-radius:9px;font-size:.88rem;font-weight:500;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-size:.88rem;color:var(--muted)}

/* List */
.list{list-style:none;padding:6px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px}
.item:hover{background:var(--bg)}
.item + .item{border-top:1px solid var(--line)}
.item:hover + .item,.item:hover{border-color:transparent}
.check{appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:var(--surface);transition:background .15s,border-color .15s}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.body{flex:1;min-width:0}
.text{overflow-wrap:anywhere;font-weight:500}
.done .text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.meta{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.pri{display:inline-flex;align-items:center;gap:6px}
.pri::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pri.high{color:var(--high)} .pri.medium{color:var(--med)} .pri.low{color:var(--low)}
.overdue{color:var(--danger);font-weight:600}
.edit-input{width:100%;border:1px solid var(--accent);background:var(--surface);border-radius:8px;padding:6px 10px}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .acts,.item:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.icon{width:32px;height:32px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--line);color:var(--ink)}
.icon.del:hover{color:var(--danger)}
.icon svg{width:16px;height:16px}
.item.enter{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

.foot{display:flex;justify-content:flex-end;margin:12px 4px 0}
.link{border:0;background:none;color:var(--muted);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--danger)}
.link[hidden]{display:none}

@media (max-width:520px){
  .top{align-items:flex-start}
  .ring{width:68px;height:68px}
  .add-row{flex-direction:column}
  .btn-primary{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>Today’s tasks</h1>
      <p id="date"></p>
    </div>
    <div class="top-right">
      <button class="theme" id="theme" aria-label="Switch theme" title="Switch theme"></button>
      <div class="ring" role="img" aria-label="Completion progress" id="ringLabel">
        <svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="34"/><circle class="bar" id="bar" cx="40" cy="40" r="34"/></svg>
        <b id="pct">0%</b>
      </div>
    </div>
  </header>

  <section class="card add" aria-label="Add a task">
    <div class="add-row">
      <input type="text" id="text" placeholder="What needs to get done?" maxlength="200" autocomplete="off" aria-label="Task name">
      <button class="btn-primary" id="addBtn" type="button">Add task</button>
    </div>
    <div class="opts">
      <label>Priority
        <select id="pri"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
      </label>
      <label>Due
        <input type="date" id="due">
      </label>
    </div>
  </section>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Filter tasks">
      <button class="tab" data-f="all" aria-pressed="true">All</button>
      <button class="tab" data-f="active" aria-pressed="false">Active</button>
      <button class="tab" data-f="done" aria-pressed="false">Completed</button>
    </div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <section class="card"><ul class="list" id="list"></ul></section>
  <div class="foot"><button class="link" id="clear" hidden>Clear completed</button></div>
</main>

<script>
(function(){
  const KEY="todo-app-v1", THEME="todo-theme";
  const $=id=>document.getElementById(id);
  const els={text:$("text"),pri:$("pri"),due:$("due"),list:$("list"),count:$("count"),clear:$("clear"),bar:$("bar"),pct:$("pct"),ring:$("ringLabel")};
  let tasks=[], filter="all", editing=null, lastAdded=null;

  const safe={
    get(k){try{return localStorage.getItem(k)}catch(e){return null}},
    set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  try{tasks=JSON.parse(safe.get(KEY)||"[]"); if(!Array.isArray(tasks))tasks=[]}catch(e){tasks=[]}
  const save=()=>safe.set(KEY,JSON.stringify(tasks));

  const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const ICON={
    edit:svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>'),
    del:svg('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>'),
    moon:svg('<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'),
    sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>')
  };

  const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
  const parseDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
  function dueLabel(t){
    if(!t.due)return null;
    const diff=Math.round((parseDate(t.due)-today())/864e5);
    const fmt=parseDate(t.due).toLocaleDateString(undefined,{day:"numeric",month:"short"});
    if(t.done)return {text:fmt,cls:""};
    if(diff<0)return {text:"Overdue, "+fmt,cls:"overdue"};
    if(diff===0)return {text:"Due today",cls:""};
    if(diff===1)return {text:"Due tomorrow",cls:""};
    return {text:"Due "+fmt,cls:""};
  }

  function add(){
    const v=els.text.value.trim();
    if(!v){els.text.focus();return}
    const t={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:v,done:false,pri:els.pri.value,due:els.due.value||"",created:Date.now()};
    tasks.unshift(t); lastAdded=t.id;
    els.text.value=""; els.due.value=""; els.pri.value="medium";
    if(filter==="done")setFilter("all");
    save(); render(); els.text.focus();
  }

  function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

  function render(){
    const total=tasks.length, done=tasks.filter(t=>t.done).length, active=total-done;
    const p=total?Math.round(done/total*100):0;
    els.pct.textContent=p+"%";
    els.bar.style.strokeDashoffset=214-(214*p/100);
    els.ring.setAttribute("aria-label",`${done} of ${total} tasks completed`);
    els.count.textContent=total?`${active} open, ${done} done`:"";
    els.clear.hidden=done===0;

    const shown=tasks.filter(t=>filter==="all"||(filter==="active"?!t.done:t.done));
    els.list.replaceChildren();
    if(!shown.length){
      const li=el("li","empty");
      const msg={all:["No tasks yet","Add your first task above to get started."],active:["Nothing open","You’re all caught up."],done:["Nothing completed yet","Finished tasks will show up here."]}[filter];
      li.append(el("strong","",msg[0]),document.createTextNode(msg[1]));
      els.list.append(li);return;
    }
    shown.forEach(t=>{
      const li=el("li","item"+(t.done?" done":"")+(t.id===lastAdded?" enter":""));
      const cb=el("input","check"); cb.type="checkbox"; cb.checked=t.done; cb.setAttribute("aria-label","Mark “"+t.text+"” complete");
      cb.addEventListener("change",()=>{t.done=cb.checked;save();render()});

      const body=el("div","body");
      if(editing===t.id){
        const inp=el("input","edit-input"); inp.type="text"; inp.value=t.text; inp.maxLength=200; inp.setAttribute("aria-label","Edit task");
        const commit=()=>{const v=inp.value.trim(); if(v)t.text=v; editing=null; save(); render()};
        inp.addEventListener("keydown",e=>{if(e.key==="Enter")commit(); if(e.key==="Escape"){editing=null;render()}});
        inp.addEventListener("blur",()=>{if(editing===t.id)commit()});
        body.append(inp); setTimeout(()=>{inp.focus();inp.select()});
      }else{
        body.append(el("div","text",t.text));
        const meta=el("div","meta");
        meta.append(el("span","pri "+t.pri,t.pri[0].toUpperCase()+t.pri.slice(1)));
        const d=dueLabel(t); if(d)meta.append(el("span",d.cls,d.text));
        body.append(meta);
      }

      const acts=el("div","acts");
      const eb=el("button","icon"); eb.type="button"; eb.innerHTML=ICON.edit; eb.setAttribute("aria-label","Edit task");
      eb.addEventListener("click",()=>{editing=t.id;render()});
      const db=el("button","icon del"); db.type="button"; db.innerHTML=ICON.del; db.setAttribute("aria-label","Delete task");
      db.addEventListener("click",()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()});
      acts.append(eb,db);

      li.append(cb,body,acts); els.list.append(li);
    });
    lastAdded=null;
  }

  function setFilter(f){
    filter=f;
    document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===f)));
    render();
  }

  // Events
  $("addBtn").addEventListener("click",add);
  els.text.addEventListener("keydown",e=>{if(e.key==="Enter")add()});
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setFilter(b.dataset.f)));
  els.clear.addEventListener("click",()=>{tasks=tasks.filter(t=>!t.done);save();render()});

  // Theme
  const root=document.documentElement, themeBtn=$("theme");
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  const paintTheme=()=>{themeBtn.innerHTML=isDark()?ICON.sun:ICON.moon};
  const savedTheme=safe.get(THEME); if(savedTheme)root.dataset.theme=savedTheme;
  themeBtn.addEventListener("click",()=>{root.dataset.theme=isDark()?"light":"dark";safe.set(THEME,root.dataset.theme);paintTheme()});

  $("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  paintTheme(); render();
})();
</script>
</body>
</html>
